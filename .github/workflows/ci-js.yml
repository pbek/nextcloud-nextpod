name: "🚗 NPM build"

on:
  pull_request:
  push:
    branches:
      - main
  workflow_dispatch:

env:
  APP_NAME: nextpod

jobs:
  release-check:
    name: Release tooling tests
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          persist-credentials: false
      - run: |
          python3 -m unittest discover -s tests/release
          python3 scripts/check-release.py --allow-unreleased

  js:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@fbc6f3992d24b796d5a048ff273f7fcc4a7b6c09 # v5
        with:
          path: ${{ env.APP_NAME }}
      - name: Install NPM packages
        run: cd ${{ env.APP_NAME }} && npm ci
      - name: Build JS
        run: cd ${{ env.APP_NAME }} && npm run build
